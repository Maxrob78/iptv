<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Initialisation - Platinum</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #030303;
      color: white;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* Cinematic Background */
    .bg-gradient {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, #1a140a 0%, #030303 60%);
      z-index: 0;
    }

    /* Ambient animated lights */
    .light-orb {
      position: absolute;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(181, 146, 77, 0.15) 0%, transparent 60%);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: breathe 8s ease-in-out infinite;
      z-index: 1;
    }

    .light-orb-2 {
      position: absolute;
      width: 1200px;
      height: 1200px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.02) 0%, transparent 60%);
      border-radius: 50%;
      top: 30%;
      left: 30%;
      transform: translate(-50%, -50%);
      animation: drift 15s linear infinite alternate;
      z-index: 1;
    }

    /* Particles Container */
    .particles {
      position: absolute;
      inset: 0;
      z-index: 2;
      opacity: 0.5;
      background-image: 
        radial-gradient(1px 1px at 20px 30px, #b5924d, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 90px 40px, #b5924d, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 200px 200px;
      animation: floatUp 60s linear infinite;
    }

    .content-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3rem;
    }

    /* Glassmorphism Logo Box */
    .logo-container {
      position: relative;
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-glass {
      position: relative;
      width: 100px;
      height: 100px;
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(181, 146, 77, 0.4) 0%, rgba(0, 0, 0, 0.8) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(181, 146, 77, 0.3);
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.5),
        inset 0 0 0 1px rgba(255, 255, 255, 0.1),
        0 0 80px rgba(181, 146, 77, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: float 6s ease-in-out infinite;
      z-index: 20;
    }

    .logo-glass::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 50%;
      background: linear-gradient(to bottom, rgba(255,255,255,0.15), transparent);
      border-radius: 30px 30px 0 0;
      pointer-events: none;
    }

    .logo-text {
      font-size: 48px;
      font-weight: 900;
      background: linear-gradient(to bottom right, #fff, #b5924d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-family: serif;
      font-style: italic;
      text-shadow: 0 0 30px rgba(181, 146, 77, 0.5);
    }

    /* High-tech Orbit Rings */
    .orbit-ring-1 {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(181, 146, 77, 0.15);
      border-top-color: #b5924d;
      border-bottom-color: rgba(181, 146, 77, 0.5);
      animation: spin 3s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
    }

    .orbit-ring-2 {
      position: absolute;
      inset: -15px;
      border-radius: 50%;
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-right: 1px solid rgba(181, 146, 77, 0.3);
      animation: spin-reverse 8s linear infinite;
    }

    .orbit-ring-3 {
      position: absolute;
      inset: -35px;
      border-radius: 50%;
      border: 1px solid transparent;
      border-left: 2px solid rgba(181, 146, 77, 0.8);
      filter: drop-shadow(0 0 10px #b5924d);
      animation: spin 2s linear infinite;
      opacity: 0.7;
    }

    .text-container {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      animation: fadeIn 2s ease-out;
    }

    h2 {
      margin: 0;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8em;
      background: linear-gradient(to right, #fff, #b5924d, #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 200% auto;
      animation: shine 4s linear infinite;
    }

    p {
      margin: 0;
      font-size: 10px;
      font-weight: 300;
      text-transform: uppercase;
      letter-spacing: 0.6em;
      color: rgba(255, 255, 255, 0.4);
    }

    /* Modern Loader */
    .loader-line {
      width: 1px;
      height: 40px;
      background: linear-gradient(to bottom, transparent, #b5924d, transparent);
      animation: scan 2s ease-in-out infinite alternate;
    }

    @keyframes breathe {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
      50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
    }

    @keyframes drift {
      0% { transform: translate(-40%, -40%); }
      100% { transform: translate(-60%, -60%); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    @keyframes scan {
      0% { transform: scaleY(0.5); opacity: 0.3; }
      100% { transform: scaleY(1.5); opacity: 1; box-shadow: 0 0 20px #b5924d; }
    }

    @keyframes floatUp {
      from { background-position: 0 0; }
      to { background-position: 0 -1000px; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="light-orb"></div>
  <div class="light-orb-2"></div>
  <div class="particles"></div>
  
  <div class="content-wrapper">
    <div class="logo-container">
      <div class="orbit-ring-3"></div>
      <div class="orbit-ring-2"></div>
      <div class="orbit-ring-1"></div>
      <div class="logo-glass">
        <span class="logo-text">P</span>
      </div>
    </div>

    <div class="text-container">
      <h2>Platinum Studio</h2>
      <p>Initialisation du système...</p>
    </div>

    <div class="loader-line"></div>
  </div>
</body>
</html>
